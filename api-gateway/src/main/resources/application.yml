server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: scraper
          uri: ${SCRAPER_URI:http://localhost:8081}
          predicates:
            - Path=/api/scraper/**
        - id: matching
          uri: ${MATCHING_URI:http://localhost:8082}
          predicates:
            - Path=/api/matches/**
        - id: tracker
          uri: ${TRACKER_URI:http://localhost:8083}
          predicates:
            - Path=/api/applications/**,/api/profile/**
        - id: submitter
          uri: ${SUBMITTER_URI:http://localhost:8084}
          predicates:
            - Path=/api/submitter/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway