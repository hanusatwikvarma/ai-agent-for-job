server:
  port: 8084

spring:
  application:
    name: application-submitter-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

submitter:
  dry-run: ${SUBMITTER_DRY_RUN:true}
  min-fit-score: 70
  headless: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus