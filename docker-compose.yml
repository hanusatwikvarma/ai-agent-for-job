networks:
  jobagent-net:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
  kafka-data:

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: jobagent-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks: [jobagent-net]

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: jobagent-kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [jobagent-net]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: jobagent-kafka-ui
    depends_on: [kafka]
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: jobagent
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks: [jobagent-net]

  mongo:
    image: mongo:7
    container_name: jobagent-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-jobagent}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-jobagent}
    volumes:
      - mongo-data:/data/db
    networks: [jobagent-net]

  mongo-express:
    image: mongo-express:1.0.2
    container_name: jobagent-mongo-express
    depends_on: [mongo]
    ports:
      - "8091:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-jobagent}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-jobagent}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-jobagent}:${MONGO_PASSWORD:-jobagent}@mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    networks: [jobagent-net]

  redis:
    image: redis:7-alpine
    container_name: jobagent-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [jobagent-net]

  mailhog:
    image: mailhog/mailhog:latest
    container_name: jobagent-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8092:8025"  # Web UI
    networks: [jobagent-net]