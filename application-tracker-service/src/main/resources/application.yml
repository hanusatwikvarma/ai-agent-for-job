server:
  port: 8083

spring:
  application:
    name: application-tracker-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://jobagent:jobagent@localhost:27017/jobagent?authSource=admin}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus